<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arqen Motion</title>
<style>
  :root { --bg: #0b0b10; --panel: #15151d; --panel2: #1c1c27; --line: #ffffff14; --text: #f4f4f7; --muted: #a1a1b0; --accent: #8b5cf6; --accent2: #22d3ee; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 Inter, "Segoe UI", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 22px; border-bottom: 1px solid var(--line); }
  header .logo { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: grid; place-items: center; font-weight: 900; }
  header h1 { font-size: 16px; margin: 0; font-weight: 700; }
  header span { color: var(--muted); font-size: 13px; }
  main { display: grid; grid-template-columns: 380px 1fr; gap: 22px; padding: 22px; max-width: 1500px; margin: 0 auto; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .tab { background: var(--panel2); border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 10px; text-align: left; cursor: pointer; font: inherit; font-weight: 600; }
  .tab.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; background: #8b5cf61a; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 5px; }
  input[type=text], input[type=number], textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 8px 10px; font: inherit; }
  textarea { min-height: 96px; resize: vertical; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  .colors { display: flex; gap: 12px; }
  .colors > div { flex: 1; }
  input[type=color] { width: 100%; height: 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 2px; }
  .img { display: flex; gap: 8px; align-items: center; }
  .img img { width: 34px; height: 34px; object-fit: contain; background: #fff; border-radius: 6px; }
  .img button { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 6px; padding: 4px 8px; cursor: pointer; }
  .fmt { display: flex; gap: 8px; margin-top: 18px; }
  .fmt button { flex: 1; background: var(--panel2); border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 8px; cursor: pointer; font: inherit; }
  .fmt button.on { border-color: var(--accent2); color: var(--accent2); }
  .go { width: 100%; margin-top: 16px; padding: 12px; border: 0; border-radius: 10px; font: inherit; font-weight: 700; font-size: 15px; color: #fff; cursor: pointer; background: linear-gradient(135deg, var(--accent), #6d28d9); }
  .go:disabled { opacity: .5; cursor: wait; }
  .status { margin-top: 10px; font-size: 13px; color: var(--muted); min-height: 20px; }
  .status.err { color: #f87171; white-space: pre-wrap; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .stagebox { display: flex; justify-content: center; }
  .stage { position: relative; overflow: hidden; border-radius: 12px; border: 1px solid var(--line); background: #000; }
  .stage iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; }
  .progress { height: 3px; background: var(--line); border-radius: 99px; margin-top: 10px; overflow: hidden; }
  .progress div { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 26px 0 10px; }
  .renders { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .renders figure { margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  /* One 16:9 box for every clip, so portrait and landscape renders line up. */
  .renders video { width: 100%; display: block; background: #000; aspect-ratio: 16 / 9; object-fit: contain; }
  .renders figcaption { padding: 8px 10px; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
  .renders figcaption span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .renders a { color: var(--accent2); text-decoration: none; flex: none; }
</style>
</head>
<body>
<header><div class="logo">A</div><h1>Arqen Motion</h1><span>Graphics clips for videos, rendered with HyperFrames</span></header>
<main>
  <section class="panel">
    <div class="tabs" id="tabs"></div>
    <form id="form" onsubmit="return false"></form>
    <div class="fmt" id="fmt">
      <button data-f="landscape" class="on">16:9 Video</button>
      <button data-f="portrait">9:16 Short</button>
    </div>
    <button class="go" id="go">Render MP4</button>
    <div class="status" id="status"></div>
  </section>
  <section>
    <div class="stagebox"><div class="stage" id="stage"><iframe id="frame"></iframe></div></div>
    <div class="progress"><div id="bar"></div></div>
    <div class="hint">The preview loops in the browser. The MP4 is rendered in headless Chrome and looks the same. Write *word* to highlight a word in the accent color.</div>
    <h2>Latest renders</h2>
    <div class="renders" id="renders"></div>
  </section>
</main>
<script>
const $ = (s) => document.querySelector(s);
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
let templates = [], current = null, format = store.get("format", "landscape");
const values = store.get("values", {});

async function init() {
  templates = await (await fetch("/api/templates")).json();
  $("#tabs").innerHTML = templates.map((t) => `<button class="tab" data-id="${t.id}">${t.title}</button>`).join("");
  $("#tabs").onclick = (e) => { const b = e.target.closest(".tab"); if (b) pick(b.dataset.id); };
  $("#fmt").onclick = (e) => { const b = e.target.closest("button"); if (b) { format = b.dataset.f; store.set("format", format); syncFmt(); preview(); } };
  $("#go").onclick = renderNow;
  syncFmt();
  pick(store.get("template", templates[0].id));
  loadRenders();
  addEventListener("resize", layout);
  addEventListener("message", (e) => { if (e.data && e.data.motionTime != null) $("#bar").style.width = (e.data.motionTime / e.data.duration) * 100 + "%"; });
}

function syncFmt() { document.querySelectorAll("#fmt button").forEach((b) => b.classList.toggle("on", b.dataset.f === format)); layout(); }

function pick(id) {
  current = templates.find((t) => t.id === id) || templates[0];
  store.set("template", current.id);
  document.querySelectorAll(".tab").forEach((b) => b.classList.toggle("on", b.dataset.id === current.id));
  const v = (values[current.id] ||= {});
  const field = (d) => {
    const val = v[d.id] ?? d.default;
    const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
    if (d.type === "color") return "";
    if (d.ui === "textarea") return `<label>${d.label}</label><textarea name="${d.id}">${esc(val)}</textarea>`;
    if (d.ui === "image") return `<label>${d.label}</label><div class="img">${val ? `<img src="/t/${esc(val)}"><button type="button" data-clear="${d.id}">Remove</button>` : ""}<input type="file" accept="image/*" data-img="${d.id}"></div>`;
    return `<label>${d.label}</label><input type="${d.type === "number" ? "number" : "text"}" step="any" name="${d.id}" value="${esc(val)}">`;
  };
  const colors = current.variables.filter((d) => d.type === "color");
  $("#form").innerHTML = current.variables.map(field).join("") +
    (colors.length ? `<div class="colors">${colors.map((d) => `<div><label>${d.label}</label><input type="color" name="${d.id}" value="${v[d.id] ?? d.default}"></div>`).join("")}</div>` : "");
  $("#form").oninput = (e) => { if (e.target.name) { v[e.target.name] = e.target.value; store.set("values", values); schedule(); } };
  $("#form").onclick = (e) => { const id = e.target.dataset.clear; if (id) { v[id] = ""; store.set("values", values); pick(current.id); preview(); } };
  $("#form").onchange = async (e) => {
    const id = e.target.dataset.img; const file = e.target.files && e.target.files[0];
    if (!id || !file) return;
    const r = await fetch("/api/upload", { method: "POST", headers: { "x-filename": file.name }, body: file });
    v[id] = (await r.json()).path; store.set("values", values); pick(current.id); preview();
  };
  preview();
}

let timer;
function schedule() { clearTimeout(timer); timer = setTimeout(preview, 350); }
function preview() {
  layout();
  $("#frame").src = `/preview/${current.id}?f=${format}&v=${encodeURIComponent(JSON.stringify(values[current.id] || {}))}`;
}

function layout() {
  const [w, h] = format === "portrait" ? [1080, 1920] : [1920, 1080];
  const box = $(".stagebox").clientWidth;
  const s = Math.min(box / w, (innerHeight * 0.68) / h);
  Object.assign($("#stage").style, { width: w * s + "px", height: h * s + "px" });
  Object.assign($("#frame").style, { width: w + "px", height: h + "px", transform: `scale(${s})` });
}

async function renderNow() {
  const status = $("#status");
  $("#go").disabled = true; status.className = "status"; status.textContent = "Starting…";
  const r = await fetch("/api/render", { method: "POST", body: JSON.stringify({ template: current.id, format, values: values[current.id] || {} }) });
  const job = await r.json();
  if (job.error) { status.className = "status err"; status.textContent = job.error; $("#go").disabled = false; return; }
  const t0 = Date.now();
  const poll = async () => {
    const j = await (await fetch("/api/jobs/" + job.id)).json();
    if (j.status === "done") { status.textContent = `Done in ${j.seconds} s: ${j.file}`; $("#go").disabled = false; loadRenders(); return; }
    if (j.status === "error") { status.className = "status err"; status.textContent = j.error; $("#go").disabled = false; return; }
    status.textContent = `${j.status === "queued" ? "Queued" : "Rendering"}… ${Math.round((Date.now() - t0) / 1000)} s`;
    setTimeout(poll, 1000);
  };
  poll();
}

async function loadRenders() {
  const files = await (await fetch("/api/renders")).json();
  $("#renders").innerHTML = files.length ? files.map((f) =>
    `<figure><video src="/renders/${encodeURIComponent(f.file)}" controls muted preload="metadata"></video><figcaption><span title="${f.file}">${f.file}</span><a href="/renders/${encodeURIComponent(f.file)}" download>Download</a></figcaption></figure>`).join("")
    : `<div class="hint">No renders yet.</div>`;
}

init();
</script>
</body>
</html>
