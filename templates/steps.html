<!doctype html>
<html data-composition-variables='[
  {"id":"title","type":"string","label":"Rubrik","default":"From prompt to video","hint":"Short headline, max 6 words"},
  {"id":"steps","type":"string","label":"Steg, en per rad: ikon | titel | undertext (2-5)","default":"code | Claude writes it | each animation\nbrowser | A tiny website | HTML + GSAP\nbolt | HyperFrames | turns that into\nvideo | An MP4 | ready to edit","ui":"textarea","hint":"2-5 lines \"icon | title | subtitle\" in order; title 1-3 words, subtitle 1-4 words or empty. Icons: code, browser, bolt, video, mic, image, chart, spark, search, globe, file, chat, cloud, lock, user, gear, play, check, upload, money, cpu, rocket"},
  {"id":"cues","type":"string","label":"Tidpunkter per punkt (valfritt, sätts av Studio)","default":""},
  {"id":"source","type":"string","label":"Källa","default":""},
  {"id":"duration","type":"number","label":"Längd (sekunder)","default":7},
  {"id":"accent","type":"color","label":"Accent","default":"#8b5cf6"},
  {"id":"accent2","type":"color","label":"Accent 2 (ljus)","default":"#22d3ee"}
]'>
<head>
  <meta charset="utf-8">
  <title>Steg</title>
  <meta name="description" content="2-5 numbered cards with icons, connected by a line, lighting up one after another.">
  <meta name="motion-use" content="The narration walks through a process or workflow in clear steps (how to do something, how a tool works, a sequence of stages).">
  <link rel="stylesheet" href="_shared/base.css">
  <style>
    .track { position: absolute; left: 50%; top: 57%; transform: translate(-50%, -50%); display: flex; align-items: center; }
    .card {
      position: relative; flex: none; border-radius: calc(var(--u) * 2.4);
      background: #17171fe6; border: 2px solid #ffffff1a;
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
      padding: calc(var(--u) * 2.5) calc(var(--u) * 1.6);
    }
    .card .done { position: absolute; inset: -2px; border-radius: inherit; border: 2px solid #ffffffb0; opacity: 0; }
    .card .content { display: contents; }
    .card .num { position: absolute; top: calc(var(--u) * 1.6); left: calc(var(--u) * 2); font-size: calc(var(--u) * 2.2); font-weight: 700; color: var(--muted); }
    .card .ico { width: calc(var(--u) * 7); height: calc(var(--u) * 7); margin-bottom: calc(var(--u) * 1.6); }
    .card .ico svg { width: 100%; height: 100%; }
    .card .name { font-size: calc(var(--u) * 3.6); font-weight: 800; line-height: 1.1; }
    .card .sub { font-size: calc(var(--u) * 2.2); color: var(--muted); margin-top: calc(var(--u) * 1); }
    .card .fade { opacity: 0.3; display: flex; flex-direction: column; align-items: center; }
    .link { position: relative; flex: none; height: calc(var(--u) * 0.5); background: #ffffff22; border-radius: 99px; }
    .link .fill { position: absolute; inset: 0; border-radius: inherit; background: var(--accent2); transform-origin: left center; box-shadow: 0 0 calc(var(--u) * 1) var(--accent2); }
    .link .tip { position: absolute; left: calc(var(--u) * -1); top: 50%; width: calc(var(--u) * 2); height: calc(var(--u) * 2); margin-top: calc(var(--u) * -1); border-radius: 50%; background: var(--accent2); box-shadow: 0 0 calc(var(--u) * 1.5) var(--accent2); }

    /* portrait: cards stacked as wide rows, icon on the left */
    .portrait .track { flex-direction: column; top: 58%; }
    .portrait .card { flex-direction: row; justify-content: flex-start; text-align: left; padding: calc(var(--u) * 3) calc(var(--u) * 4); }
    .portrait .card .fade { flex-direction: row; gap: calc(var(--u) * 4); align-items: center; }
    .portrait .card .ico { width: calc(var(--u) * 12); height: calc(var(--u) * 12); margin: 0; flex: none; }
    .portrait .card .name { font-size: calc(var(--u) * 6.4); }
    .portrait .card .sub { font-size: calc(var(--u) * 4); }
    .portrait .card .num { font-size: calc(var(--u) * 2.8); }
    .portrait .link { width: calc(var(--u) * 0.6); }
    .portrait .link .fill { transform-origin: center top; }
    .portrait .link .tip { left: 50%; top: calc(var(--u) * -1); margin: 0 0 0 calc(var(--u) * -1); }
  </style>
</head>
<body>
  <div id="root" data-composition-id="steps" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DURATION}}">
    <div class="gridbg"></div>
    <div class="title" id="title"></div>
    <div class="track" id="track"></div>
    <div class="source"></div>
    <script src="_shared/gsap.min.js"></script>
    <script src="_shared/base.js"></script>
    <script src="_shared/icons.js"></script>
    <script>
      const { v, W, H } = M;
      const P = M.portrait;
      document.getElementById("title").innerHTML = M.rich(v.title);
      const steps = M.lines(v.steps).slice(0, 5).map((l) => { const [icon, name = "", sub = ""] = M.cells(l); return { icon, name, sub }; });
      const n = Math.max(1, steps.length);
      const track = document.getElementById("track");

      // Size cards to fill the width (landscape) or height (portrait), with links between them.
      const u = Math.min(W, H) / 100;
      const linkLen = P ? Math.min(u * 6, H * 0.03) : Math.min(u * 9, W * 0.05);
      const cardW = P ? W * 0.8 : Math.min(u * 30, (W * 0.88 - linkLen * (n - 1)) / n);
      const cardH = P ? Math.min(u * 25, (H * 0.62 - linkLen * (n - 1)) / n) : Math.min(cardW * 1.05, H * 0.5);

      const cards = [], links = [];
      steps.forEach((s, i) => {
        if (i) {
          const l = document.createElement("div");
          l.className = "link";
          l.style[P ? "height" : "width"] = linkLen + "px";
          l.innerHTML = '<div class="fill"></div><div class="tip"></div>';
          track.appendChild(l);
          links.push(l);
        }
        const c = document.createElement("div");
        c.className = "card";
        c.style.width = cardW + "px";
        c.style.height = cardH + "px";
        c.innerHTML = `<div class="num">${String(i + 1).padStart(2, "0")}</div><div class="fade"><div class="ico">${M.icon(s.icon)}</div>` +
          `<div><div class="name">${M.rich(s.name)}</div>${s.sub ? `<div class="sub">${M.rich(s.sub)}</div>` : ""}</div></div>` +
          `<div class="done"></div><div class="lit-glow"></div>`;
        track.appendChild(c);
        cards.push(c);
      });
      // Long titles: shrink to the card.
      for (const c of cards) M.fit(c.querySelector(".name"), cardW * (P ? 0.62 : 0.86));

      const tl = M.timeline();
      tl.from("#title", { opacity: 0, y: -30, duration: 0.6, ease: "power2.out" }, 0);
      tl.from(cards, { opacity: 0, y: P ? 0 : 24, x: P ? -24 : 0, duration: 0.5, stagger: 0.08, ease: "power2.out" }, 0.2);
      tl.from(links, { opacity: 0, duration: 0.4 }, 0.3);
      const step = Math.min(1.1, (M.dur * 0.62) / n);
      const t0 = 0.7;
      // With cues, each card lights up as the narration reaches its step.
      const cues = M.cues(cards.length);
      const at = (i) => (cues ? Math.max(0.6, cues[i]) : t0 + i * step);
      cards.forEach((c, i) => {
        const t = at(i);
        // The previous card turns from active (glowing) to done (white border).
        if (i) tl.to(cards[i - 1].querySelector(".lit-glow"), { opacity: 0, duration: 0.3 }, t);
        tl.to(c.querySelector(".fade"), { opacity: 1, duration: 0.3 }, t);
        tl.to(c.querySelector(".done"), { opacity: 1, duration: 0.3 }, t);
        tl.to(c.querySelector(".lit-glow"), { opacity: 1, duration: 0.3 }, t);
        tl.from(c.querySelector(".ico"), { scale: 0.6, duration: 0.45, ease: "back.out(2.5)" }, t);
        const l = links[i];
        if (l) {
          const d = Math.max(0.2, at(i + 1) - t - 0.35);
          tl.from(l.querySelector(".fill"), { [P ? "scaleY" : "scaleX"]: 0, duration: d, ease: "power1.inOut" }, t + 0.3);
          tl.fromTo(l.querySelector(".tip"), { opacity: 0, [P ? "y" : "x"]: 0 }, { opacity: 1, duration: 0.1 }, t + 0.3);
          tl.to(l.querySelector(".tip"), { [P ? "y" : "x"]: linkLen, duration: d, ease: "power1.inOut" }, t + 0.3);
        }
      });
      M.finish(tl);
    </script>
  </div>
</body>
</html>
