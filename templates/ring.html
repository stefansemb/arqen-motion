<!doctype html>
<html data-composition-variables='[
  {"id":"value","type":"string","label":"Procent (t.ex. 73%)","default":"73%","hint":"A percentage from the narration, e.g. 73%"},
  {"id":"label","type":"string","label":"Text (*ord* = markerat)","default":"of developers now use *AI coding tools* every week","hint":"What the percentage measures, max 12 words"},
  {"id":"source","type":"string","label":"Källa","default":""},
  {"id":"duration","type":"number","label":"Längd (sekunder)","default":6},
  {"id":"accent","type":"color","label":"Accent","default":"#8b5cf6"},
  {"id":"accent2","type":"color","label":"Accent 2","default":"#22d3ee"}
]'>
<head>
  <meta charset="utf-8">
  <title>Procentring</title>
  <meta name="description" content="A ring that fills up to a percentage while the number counts up, with a label beside it.">
  <meta name="motion-use" content="The narration states a share or percentage of something (adoption, accuracy, market share of one player, a survey result).">
  <link rel="stylesheet" href="_shared/base.css">
  <style>
    .stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * 8); padding: 0 8%; }
    .portrait .stage { flex-direction: column; gap: calc(var(--u) * 8); text-align: center; }
    .ring { position: relative; flex: none; width: calc(var(--u) * 52); height: calc(var(--u) * 52); }
    .portrait .ring { width: calc(var(--u) * 72); height: calc(var(--u) * 72); }
    .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
    .ring .track { fill: none; stroke: #ffffff12; }
    .ring .arc { fill: none; stroke: url(#grad); stroke-linecap: round; filter: drop-shadow(0 0 6px color-mix(in srgb, var(--accent2) 60%, transparent)); }
    .ring .num {
      position: absolute; inset: 0; display: grid; place-items: center;
      font-size: calc(var(--u) * 13); font-weight: 900; letter-spacing: -0.04em; font-variant-numeric: tabular-nums;
    }
    .portrait .ring .num { font-size: calc(var(--u) * 18); }
    .label { font-size: calc(var(--u) * 5.2); font-weight: 650; line-height: 1.2; max-width: calc(var(--u) * 80); }
    .portrait .label { font-size: calc(var(--u) * 6.2); max-width: none; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="ring" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DURATION}}">
    <div class="stage">
      <div class="ring">
        <svg viewBox="0 0 100 100">
          <defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color: var(--accent)"/><stop offset="1" style="stop-color: var(--accent2)"/></linearGradient></defs>
          <circle class="track" cx="50" cy="50" r="42" stroke-width="9"/>
          <circle class="arc" id="arc" cx="50" cy="50" r="42" stroke-width="9"/>
        </svg>
        <div class="num" id="num"></div>
      </div>
      <div class="label" id="label"></div>
    </div>
    <div class="source"></div>
    <script src="_shared/gsap.min.js"></script>
    <script src="_shared/base.js"></script>
    <script>
      const { v } = M;
      // "73%" / "73.5 %" / "73" -> 73; the ring shows it as a share of 100.
      const m = String(v.value).replace(",", ".").match(/(\d+(?:\.\d+)?)/);
      const value = m ? Math.min(100, Math.max(0, parseFloat(m[1]))) : 0;
      const dec = m && m[1].includes(".") ? Math.min(1, m[1].split(".")[1].length) : 0;
      document.getElementById("label").innerHTML = M.rich(v.label);
      const num = document.getElementById("num");
      const arc = document.getElementById("arc");
      const len = 2 * Math.PI * 42;
      arc.style.strokeDasharray = len;
      const show = (p) => {
        arc.style.strokeDashoffset = len * (1 - (value / 100) * p);
        num.textContent = ((value * p).toFixed(dec)) + "%";
      };
      show(0);

      const tl = M.timeline();
      const o = { p: 0 };
      tl.from(".ring", { opacity: 0, scale: 0.85, duration: 0.6, ease: "power2.out" }, 0);
      tl.to(o, { p: 1, duration: Math.min(2, M.dur * 0.4), ease: "power3.out", onUpdate: () => show(o.p) }, 0.3);
      tl.from("#label", { opacity: 0, [M.portrait ? "y" : "x"]: 40, duration: 0.6, ease: "power2.out" }, 0.8);
      M.finish(tl);
    </script>
  </div>
</body>
</html>
