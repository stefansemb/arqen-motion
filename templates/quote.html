<!doctype html>
<html data-composition-variables='[
  {"id":"quote","type":"string","label":"Citat (*ord* = markerat)","default":"AI will be the *most important* technology humanity has ever built.","ui":"textarea"},
  {"id":"author","type":"string","label":"Vem","default":"Sam Altman"},
  {"id":"role","type":"string","label":"Roll","default":"CEO, OpenAI"},
  {"id":"source","type":"string","label":"Källa","default":""},
  {"id":"duration","type":"number","label":"Längd (sekunder)","default":7},
  {"id":"accent","type":"color","label":"Accent","default":"#8b5cf6"},
  {"id":"accent2","type":"color","label":"Accent 2","default":"#22d3ee"}
]'>
<head>
  <meta charset="utf-8">
  <title>Citatkort</title>
  <meta name="description" content="A quote revealed word by word, with who said it.">
  <meta name="motion-use" content="The narration quotes a named person or source.">
  <link rel="stylesheet" href="_shared/base.css">
  <style>
    .stage { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 12%; }
    .portrait .stage { padding: 0 8%; }
    .portrait .quote { font-size: calc(var(--u) * 8.5); }
    .portrait .author { font-size: calc(var(--u) * 4.6); }
    .portrait .role { font-size: calc(var(--u) * 3.6); }
    .mark {
      font-size: calc(var(--u) * 26); font-weight: 900; line-height: 0.6; height: calc(var(--u) * 12); font-family: Georgia, serif;
      background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .quote { font-size: calc(var(--u) * 6.4); font-weight: 650; line-height: 1.22; letter-spacing: -0.01em; }
    .who { display: flex; align-items: center; gap: calc(var(--u) * 2.5); margin-top: calc(var(--u) * 5); }
    .dash { width: calc(var(--u) * 7); height: calc(var(--u) * 0.6); border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent2)); transform-origin: left; }
    .author { font-size: calc(var(--u) * 3.6); font-weight: 750; }
    .role { font-size: calc(var(--u) * 2.8); color: var(--muted); margin-top: calc(var(--u) * 0.5); }
  </style>
</head>
<body>
  <div id="root" data-composition-id="quote" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DURATION}}">
    <div class="stage">
      <div class="mark" id="mark">&ldquo;</div>
      <div class="quote" id="quote"></div>
      <div class="who" id="who">
        <div class="dash" id="dash"></div>
        <div><div class="author" id="author"></div><div class="role" id="role"></div></div>
      </div>
    </div>
    <div class="source"></div>
    <script src="_shared/gsap.min.js"></script>
    <script src="_shared/base.js"></script>
    <script>
      const { v } = M;
      const q = document.getElementById("quote");
      const words = M.words(q, v.quote);
      M.fit(q, Infinity, M.H * (M.portrait ? 0.5 : 0.48));
      document.getElementById("author").textContent = v.author || "";
      document.getElementById("role").textContent = v.role || "";
      if (!v.author && !v.role) document.getElementById("who").style.display = "none";

      const tl = M.timeline();
      const reveal = Math.min(1.8, M.dur * 0.35);
      tl.from("#mark", { opacity: 0, scale: 0.5, transformOrigin: "left center", duration: 0.6, ease: "back.out(2)" }, 0);
      tl.from(words, { opacity: 0, y: 24, duration: 0.5, ease: "power2.out", stagger: reveal / Math.max(1, words.length) }, 0.25);
      const t = 0.25 + reveal;
      tl.from("#dash", { scaleX: 0, duration: 0.5, ease: "power3.out" }, t);
      tl.from(["#author", "#role"], { opacity: 0, x: -30, duration: 0.5, ease: "power2.out", stagger: 0.12 }, t + 0.15);
      M.finish(tl);
    </script>
  </div>
</body>
</html>
