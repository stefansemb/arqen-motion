<!doctype html>
<html data-composition-variables='[
  {"id":"title","type":"string","label":"Rubrik","default":"What you need to know","hint":"Short headline, max 6 words"},
  {"id":"points","type":"string","label":"Punkter, en per rad (2-5, *ord* = markerat)","default":"Runs *locally* on your machine\nNo per-render fees\nWorks with any coding agent\nOpen source under Apache 2.0","ui":"textarea","hint":"2-5 short key points from the narration, one per line, max 7 words each"},
  {"id":"source","type":"string","label":"Källa","default":""},
  {"id":"duration","type":"number","label":"Längd (sekunder)","default":7},
  {"id":"accent","type":"color","label":"Accent","default":"#8b5cf6"},
  {"id":"accent2","type":"color","label":"Accent 2","default":"#22d3ee"}
]'>
<head>
  <meta charset="utf-8">
  <title>Checklista</title>
  <meta name="description" content="2-5 key points, each ticked off with a check mark as it appears.">
  <meta name="motion-use" content="The narration sums up key points, features, requirements or takeaways (what is new, what you need, why it matters).">
  <link rel="stylesheet" href="_shared/base.css">
  <style>
    .stage { position: absolute; left: 50%; top: 57%; transform: translate(-50%, -50%); display: grid; gap: calc(var(--u) * 3.4); width: max-content; max-width: min(84%, calc(var(--u) * 150)); }
    .portrait .stage { width: 86%; gap: calc(var(--u) * 6); }
    .row { display: flex; align-items: center; gap: calc(var(--u) * 3); }
    .box {
      flex: none; width: calc(var(--u) * 6.4); height: calc(var(--u) * 6.4); border-radius: calc(var(--u) * 1.6);
      display: grid; place-items: center; position: relative;
      background: #17171fe6; border: 2px solid #ffffff22;
    }
    .box .fill { position: absolute; inset: -2px; border-radius: inherit; background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 0 calc(var(--u) * 2) color-mix(in srgb, var(--accent2) 45%, transparent); }
    .box svg { position: relative; width: 62%; height: 62%; }
    .box path { fill: none; stroke: #fff; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
    .text { font-size: calc(var(--u) * 4.4); font-weight: 700; line-height: 1.2; }
    .portrait .box { width: calc(var(--u) * 9); height: calc(var(--u) * 9); }
    .portrait .text { font-size: calc(var(--u) * 6); }
  </style>
</head>
<body>
  <div id="root" data-composition-id="checklist" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DURATION}}">
    <div class="title" id="title"></div>
    <div class="stage" id="stage"></div>
    <div class="source"></div>
    <script src="_shared/gsap.min.js"></script>
    <script src="_shared/base.js"></script>
    <script>
      const { v } = M;
      document.getElementById("title").innerHTML = M.rich(v.title);
      const stage = document.getElementById("stage");
      const rows = M.lines(v.points).slice(0, 5).map((p) => {
        const el = document.createElement("div");
        el.className = "row";
        el.innerHTML = `<div class="box"><div class="fill"></div><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><div class="text">${M.rich(p)}</div>`;
        stage.appendChild(el);
        return el;
      });

      const tl = M.timeline();
      tl.from("#title", { opacity: 0, y: -30, duration: 0.6, ease: "power2.out" }, 0);
      const step = Math.min(0.9, (M.dur * 0.6) / Math.max(1, rows.length));
      rows.forEach((row, i) => {
        const t = 0.5 + i * step;
        tl.from(row, { opacity: 0, x: -40, duration: 0.45, ease: "power2.out" }, t);
        tl.from(row.querySelector(".fill"), { opacity: 0, scale: 0.4, duration: 0.35, ease: "back.out(2)" }, t + 0.25);
        M.draw(tl, row.querySelector("path"), t + 0.35, 0.35);
      });
      M.finish(tl);
    </script>
  </div>
</body>
</html>
